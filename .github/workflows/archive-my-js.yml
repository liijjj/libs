name: archive my js

# 改了 js/my/*.js 之后，自动在 js/my/archive/ 里留一份带北京时间戳的副本。
# 内容与最新归档相同的不会重复归档；机器人自己的提交不会再次触发。

on:
  push:
    branches: [main]
    paths:
      - 'js/my/*.js'

permissions:
  contents: write

jobs:
  archive:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 复制改动过的文件到 archive/
        run: |
          set -euo pipefail
          STAMP=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')
          mkdir -p js/my/archive
          for f in js/my/*.js; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .js)
            last=$(ls -1 "js/my/archive/${base}"-*.js 2>/dev/null | sort | tail -n1 || true)
            if [ -n "$last" ] && cmp -s "$f" "$last"; then
              echo "skip $f（与最新归档一致）"
              continue
            fi
            out="js/my/archive/${base}-${STAMP}.js"
            cp "$f" "$out"
            echo "$f -> $out"
          done

      - name: 提交
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "没有归档变化"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/my/archive
          git commit -m "chore(archive): $(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')"
          git push
