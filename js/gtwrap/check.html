<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>gtwrap check</title>
<style>
    body{font:15px/1.7 system-ui;margin:20px auto;max-width:760px;background:#16181c;color:#e6e8eb}
    #out{white-space:pre-wrap;background:#0b0d10;color:#cfd6df;padding:12px;border-radius:8px;font:12px/1.6 Consolas,monospace}
</style>
</head>
<body>
<h1>gtwrap self check</h1>
<p id="target">深色页面上的结构自检：原生 select、跟随配色、气泡只留正文（#goog-gt-vt 的第二个子元素）。</p>
<pre id="out" translate="no">running…</pre>

<script>
window.gtwrapSettings = { languages: ['zh-CN', 'en', 'ja'], position: 'bottom-left' };
</script>
<script src="gtwrap.js"></script>
<script>
var lines = [];
function say(s) { lines.push(s); document.getElementById('out').textContent = lines.join('\n'); }

setTimeout(function () {
    say('version=' + (window.GTWrap && GTWrap.version));

    var sel = document.querySelector('.gtwrap-select');
    var r = sel ? sel.getBoundingClientRect() : null;
    say('select=' + (sel ? 'yes' : 'no') + ' at ' + (r ? Math.round(r.left) + ',' + Math.round(r.top) : '-') +
        ' bg=' + (sel ? getComputedStyle(sel).backgroundColor : '-'));
    say('dark=' + document.documentElement.classList.contains('gtwrap-dark'));

    // 按真实结构造气泡：#goog-gt-tt > #goog-gt-vt > [头, 正文, 脚]
    var wrap = document.createElement('div');
    wrap.className = 'skiptranslate';
    wrap.style.cssText = 'position:absolute;top:0;left:0';

    var tt = document.createElement('div');
    tt.id = 'goog-gt-tt';
    tt.style.cssText = 'width:320px;background:#fff;padding:8px';

    var vt = document.createElement('div');
    vt.id = 'goog-gt-vt';

    var head = document.createElement('div');
    head.id = 'goog-gt-tt-head';
    head.textContent = 'G 原文';
    var body = document.createElement('div');
    body.id = 'goog-gt-tt-body';
    body.textContent = 'Now let us think about this question...';
    var foot = document.createElement('div');
    foot.id = 'goog-gt-tt-foot';
    foot.innerHTML = '请对此翻译评分 <button>👍</button><button>👎</button>';

    vt.appendChild(head); vt.appendChild(body); vt.appendChild(foot);
    tt.appendChild(vt);
    wrap.appendChild(tt);
    document.body.appendChild(wrap);

    document.getElementById('target').dispatchEvent(new MouseEvent('mouseover', { bubbles: true }));

    setTimeout(function () {
        say('head=' + getComputedStyle(head).display +
            ' body=' + getComputedStyle(body).display +
            ' foot=' + getComputedStyle(foot).display);
        say('tooltip font-size=' + getComputedStyle(tt).fontSize + ' line-height=' + getComputedStyle(tt).lineHeight);
        say('tooltip bg=' + getComputedStyle(tt).backgroundColor);
        document.title = 'check done';
    }, 700);
}, 3600);
</script>
</body>
</html>
