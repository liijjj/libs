<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>gtwrap check</title>
<style>body{font:15px/1.7 system-ui;margin:20px auto;max-width:700px}</style>
</head>
<body>
<h1>gtwrap self check</h1>
<p>Structural check: hidden native widget, our pill, banner suppression, tooltip visibility.</p>

<script>
window.gtwrapSettings = { languages: ['zh-CN', 'en'], position: 'bottom-left' };
</script>
<script src="gtwrap.js"></script>
<script>
setTimeout(function () {
    var out = [];

    var host = document.getElementById('gtwrap-host');
    var hr = host ? host.getBoundingClientRect() : null;
    out.push('host offscreen=' + (hr && hr.left < -1000));
    out.push('combo=' + !!document.querySelector('.goog-te-combo'));

    var pill = document.querySelector('.gtwrap-cur');
    var pr = pill ? pill.getBoundingClientRect() : null;
    out.push('pill=' + (pr ? Math.round(pr.left) + ',' + Math.round(pr.top) + '/' + innerHeight : 'none'));

    // 模拟谷歌注入的横幅：<div class="skiptranslate"><iframe class="VIpgJd-ZVi9od-ORHb-OEVmcd"></iframe></div>
    var barWrap = document.createElement('div');
    barWrap.className = 'skiptranslate';
    barWrap.style.cssText = 'height:40px;position:relative';
    var bar = document.createElement('iframe');
    bar.className = 'VIpgJd-ZVi9od-ORHb-OEVmcd skiptranslate';
    bar.style.cssText = 'width:100%;height:40px;border:0';
    barWrap.appendChild(bar);
    document.body.appendChild(barWrap);
    document.body.style.top = '40px';
    document.body.style.position = 'relative';

    // 模拟谷歌的原文气泡：<div class="skiptranslate"><div id="goog-gt-tt">…</div></div>
    var tipWrap = document.createElement('div');
    tipWrap.className = 'skiptranslate';
    tipWrap.style.cssText = 'position:absolute;top:0;left:0';
    var tip = document.createElement('div');
    tip.id = 'goog-gt-tt';
    tip.textContent = 'original text';
    tipWrap.appendChild(tip);
    document.body.appendChild(tipWrap);

    setTimeout(function () {
        out.push('banner display=' + getComputedStyle(barWrap).display + '/' + getComputedStyle(bar).display);
        out.push('body top=' + getComputedStyle(document.body).top);
        out.push('tooltip wrapper display=' + getComputedStyle(tipWrap).display);
        out.push('tooltip itself display=' + getComputedStyle(tip).display);
        document.title = out.join(' | ');
    }, 100);
}, 2500);
</script>
</body>
</html>
